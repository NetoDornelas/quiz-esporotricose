<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mitos ou Verdades? — Esporotricose</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    background: #0a1e3c;
    color: #0a1e3c;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url('https://d31zra5bs5df64.cloudfront.net/prod/3D6dJ69Xo8QTypMbWUTEd5271wy/chat/3LHN8Np3FBF8li4nQcYHirAfyjR/3LHaccbV6WvWxyyu68ck6bvPLpE.png?Expires=1793117127&Key-Pair-Id=K2FT0I8VPJSP5H&Signature=brjg1ulTE8cnXog4p~IKtNVpp5h-St-8CAeX5CPj5PMFKxL39vrc~eKVCs0CPdn8b1E2eknkOdSpdwshu63u1JHFELcV7P3xYaP7HiQOwf~2N6wMcf56lAgysNUORbIOVa3Jo2ZEsTb5eAHiCqMQd5ICZPw0ANBBXXwtPj6cp7j5uDbr4AuT~pRnvo9UTRZNdKLEe10zZuIr~6-GUlQA9cr4SuPjJwEyx0JQ9e0vNzV8nYGWjJO2lxXSOfiChtVfy2GusZPprV7j8kv63XL0T8LAeaWmca4mEJ1ri-XIvD1IdGaa4AZm9upJSVJtagA0F7CkPd1DMgpzqRqgCddhgw__');
    background-size: cover;
    background-position: center;
    opacity: 0.20;
    z-index: 0;
    pointer-events: none;
  }

  .screen {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }

  .screen.hidden {
    display: none;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 900px;
    border-radius: 28px;
    border-left: 10px solid #f7c948;
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
    padding: clamp(24px, 4vw, 48px);
    text-align: center;
  }

  .eyebrow {
    display: inline-block;
    background: #0a1e3c;
    color: #f7c948;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    padding: 8px 22px;
    border-radius: 50px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    color: #0a1e3c;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 15px;
  }

  .subtitle {
    font-size: clamp(1rem, 2.5vw, 1.6rem);
    color: #2c3e50;
    margin-bottom: 25px;
  }

  .paw {
    font-size: clamp(2rem, 5vw, 3.5rem);
    letter-spacing: 12px;
    color: #f7c948;
    margin-bottom: 22px;
  }

  .btn {
    display: inline-block;
    background: #f7c948;
    color: #0a1e3c;
    border: none;
    border-radius: 50px;
    padding: 18px 40px;
    font-size: clamp(1.2rem, 3vw, 2rem);
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 8px 20px rgba(247, 201, 72, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    margin-top: 10px;
  }

  .btn:active {
    transform: scale(0.96);
    box-shadow: 0 4px 12px rgba(247, 201, 72, 0.3);
  }

  .btn-secondary {
    background: #0a1e3c;
    color: #ffffff;
    box-shadow: 0 8px 20px rgba(10, 30, 60, 0.4);
  }

  .btn-secondary:active {
    box-shadow: 0 4px 12px rgba(10, 30, 60, 0.3);
  }

  .progress-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 28px;
  }

  .counter {
    color: #ffffff;
    font-size: clamp(1rem, 2vw, 1.4rem);
    font-weight: 800;
    white-space: nowrap;
  }

  .bar-outer {
    flex: 1;
    height: 12px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 50px;
    overflow: hidden;
  }

  .bar-inner {
    height: 100%;
    width: 0%;
    background: #f7c948;
    border-radius: 50px;
    transition: width 0.4s ease;
  }

  .question {
    font-size: clamp(1.5rem, 3.8vw, 2.8rem);
    font-weight: 800;
    color: #0a1e3c;
    line-height: 1.35;
    margin-bottom: 30px;
  }

  .answer-box {
    background: #f2f5fa;
    border-radius: 22px;
    padding: 24px;
    margin-top: 20px;
    text-align: left;
    font-size: clamp(1.05rem, 2.2vw, 1.6rem);
    line-height: 1.5;
    animation: pop 0.35s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: clamp(1rem, 2vw, 1.3rem);
    padding: 10px 20px;
    border-radius: 50px;
    margin-bottom: 14px;
    color: #ffffff;
  }

  .badge.verdade {
    background: #f7c948;
    color: #0a1e3c;
  }

  .badge.mito {
    background: #1d4ed8;
  }

  .badge span {
    font-size: clamp(1.3rem, 2.5vw, 1.8rem);
  }

  .note {
    color: #ffffff;
    margin-top: 18px;
    font-size: clamp(0.8rem, 1.8vw, 1.1rem);
    opacity: 0.85;
  }

  @media (max-width: 700px) {
    .screen {
      padding: 12px;
    }
    .card {
      border-left-width: 6px;
      border-radius: 20px;
    }
    .question {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
    }
  }
</style>
</head>
<body>

  <!-- TELA INICIAL -->
  <section id="startScreen" class="screen">
    <div class="card">
      <div class="eyebrow">Saúde dos Pets</div>
      <h1>Mitos ou Verdades?</h1>
      <div class="paw">🐾🐾</div>
      <p class="subtitle">Quiz Interativo — Esporotricose</p>
      <button class="btn" id="startBtn">Começar</button>
      <p class="note" style="color:#2c3e50; margin-top:16px;">Apresente com o celular na horizontal</p>
    </div>
  </section>

  <!-- TELA QUIZ -->
  <section id="quizScreen" class="screen hidden">
    <div style="width:100%; max-width:900px;">
      <div class="progress-wrap">
        <span class="counter" id="counter">Questão 1 de 10</span>
        <div class="bar-outer"><div class="bar-inner" id="progressBar"></div></div>
      </div>

      <div class="card">
        <p class="question" id="questionText"></p>
        <button class="btn" id="revealBtn">Revelar resposta</button>
        <div id="answerArea"></div>
        <button class="btn btn-secondary hidden" id="nextBtn">Próxima</button>
      </div>
    </div>
  </section>

  <!-- TELA FINAL -->
  <section id="endScreen" class="screen hidden">
    <div class="card">
      <div class="eyebrow">Concluído</div>
      <h1>Fim do Quiz</h1>
      <div class="paw">🐾🐾</div>
      <p class="subtitle">Obrigado pela participação!</p>
      <button class="btn" id="restartBtn">Recomeçar</button>
    </div>
  </section>

<script>
  const questions = [
    {
      text: "A esporotricose passa de uma pessoa para outra.",
      answer: "mito",
      explanation: "Não. A doença não é transmitida entre humanos. A principal via é o contato com gato doente (arranhão, mordida ou secreção), além do ambiente."
    },
    {
      text: "Só quem tem contato com gato doente pode pegar esporotricose.",
      answer: "mito",
      explanation: "Não. O fungo também vive no solo e em matéria orgânica. A pessoa pode se infectar pelo ambiente, como em ferimentos com espinhos ou madeira."
    },
    {
      text: "Para receber o tratamento gratuito pelo SUS, é preciso comprovar baixa renda.",
      answer: "mito",
      explanation: "Não. O tratamento é gratuito e universal. Basta atendimento médico, receita e documento com foto — sem exigência de renda."
    },
    {
      text: "Tosse e espirro do gato doente podem transmitir a doença.",
      answer: "verdade",
      explanation: "Sim. Além de arranhões e mordidas, secreções, tosse e espirro também espalham o fungo. Por isso usa-se máscara ao cuidar do animal."
    },
    {
      text: "O tratamento do gato pode ser interrompido assim que as feridas cicatrizam.",
      answer: "mito",
      explanation: "Não. O remédio deve continuar até a cura clínica e mais 30 a 60 dias, para evitar recidiva ou resistência."
    },
    {
      text: "A castração do gato ajuda a prevenir a esporotricose.",
      answer: "verdade",
      explanation: "Sim. Castrar reduz o acesso à rua e o contato com animais doentes ou fontes de contaminação."
    },
    {
      text: "Um gato que vive só dentro de casa nunca pega esporotricose.",
      answer: "mito",
      explanation: "Não. O fungo pode entrar pela porta ou janela, em solo ou matéria vegetal. Todo gato deve ser observado."
    },
    {
      text: "Água sanitária pode ser usada para desinfetar objetos do gato doente.",
      answer: "verdade",
      explanation: "Sim. O hipoclorito de sódio é recomendado para higienizar superfícies, cobertas e caixas de transporte contaminadas."
    },
    {
      text: "Casos graves em humanos podem exigir anfotericina B, além do itraconazol.",
      answer: "verdade",
      explanation: "Sim. O itraconazol é o principal tratamento; em casos graves, associa-se anfotericina B. O SUS fornece ambos."
    },
    {
      text: "Ferida que não cicatriza deve ser investigada, mesmo sem lembrança de arranhão.",
      answer: "verdade",
      explanation: "Sim. A exposição pode ter ocorrido pelo ambiente ou sem que a pessoa percebesse. Ferida persistente exige avaliação médica."
    }
  ];

  const startScreen = document.getElementById('startScreen');
  const quizScreen = document.getElementById('quizScreen');
  const endScreen = document.getElementById('endScreen');
  const questionText = document.getElementById('questionText');
  const revealBtn = document.getElementById('revealBtn');
  const answerArea = document.getElementById('answerArea');
  const nextBtn = document.getElementById('nextBtn');
  const counter = document.getElementById('counter');
  const progressBar = document.getElementById('progressBar');

  let currentIndex = 0;
  let revealed = false;

  function showScreen(screen) {
    [startScreen, quizScreen, endScreen].forEach(s => s.classList.add('hidden'));
    screen.classList.remove('hidden');
  }

  function renderQuestion() {
    const q = questions[currentIndex];
    questionText.textContent = q.text;
    answerArea.innerHTML = '';
    nextBtn.classList.add('hidden');
    revealBtn.classList.remove('hidden');
    revealed = false;
    counter.textContent = `Questão ${currentIndex + 1} de ${questions.length}`;
    progressBar.style.width = `${((currentIndex) / questions.length) * 100}%`;
  }

  function revealAnswer() {
    if (revealed) return;
    const q = questions[currentIndex];
    const isVerdade = q.answer === 'verdade';
    const badgeClass = isVerdade ? 'verdade' : 'mito';
    const icon = isVerdade ? '✔' : '✘';
    const label = isVerdade ? 'Verdade' : 'Mito';

    answerArea.innerHTML = `
      <div class="answer-box">
        <div class="badge ${badgeClass}"><span>${icon}</span> ${label}</div>
        <div>${q.explanation}</div>
      </div>
    `;

    revealBtn.classList.add('hidden');
    nextBtn.classList.remove('hidden');
    revealed = true;
    progressBar.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
  }

  function nextQuestion() {
    if (!revealed) return;
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      showScreen(endScreen);
    }
  }

  function restartQuiz() {
    currentIndex = 0;
    renderQuestion();
    showScreen(startScreen);
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    currentIndex = 0;
    renderQuestion();
    showScreen(quizScreen);
  });

  revealBtn.addEventListener('click', revealAnswer);
  nextBtn.addEventListener('click', nextQuestion);
  document.getElementById('restartBtn').addEventListener('click', restartQuiz);
</script>

</body>
</html>
